<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120e0f; --surface:#1c1616; --surface2:#241c1c;
  --moon:#f0dfa8; --sky:#7f9bd4; --teal:#2f6b5e;
  --text:#f3ece7; --muted:#a5938c; --line:#332726;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
h1,h2,.serif{font-family:'Shippori Mincho',Georgia,serif;}
#phone{
  width:min(420px,100vw); height:min(860px,100dvh);
  border-radius:28px; overflow:hidden;
  position:relative; z-index:1; box-shadow:0 30px 80px rgba(0,0,0,.6);
  display:flex; flex-direction:column;
  background:
    radial-gradient(circle at 82% 8%, rgba(255,248,220,.85) 0%, rgba(255,248,220,.5) 5%, rgba(255,248,220,0) 8%),
    radial-gradient(1.4px 1.4px at 10% 14%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 24% 32%, #fff, transparent),
    radial-gradient(1px 1px at 38% 6%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 55% 22%, #fff, transparent),
    radial-gradient(1px 1px at 68% 10%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 8% 40%, #fff, transparent),
    radial-gradient(1px 1px at 30% 55%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 90% 28%, #fff, transparent),
    radial-gradient(1px 1px at 48% 40%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 15% 65%, #fff, transparent),
    radial-gradient(1px 1px at 75% 50%, #fff, transparent),
    linear-gradient(180deg, #0a0e1c 0%, #100d14 35%, #1c1616 70%, #1c1616 100%);
  background-repeat:no-repeat;
  background-size:100% 100%;
}
#phone::after{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(1px 1px at 20% 20%, #fff, transparent),
    radial-gradient(1px 1px at 60% 12%, #fff, transparent),
    radial-gradient(1px 1px at 42% 30%, #fff, transparent),
    radial-gradient(1px 1px at 80% 22%, #fff, transparent),
    radial-gradient(1px 1px at 12% 50%, #fff, transparent);
  animation:twinkle 3.5s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.25;} to{opacity:1;}}
#list, #chat, #final{ position:relative; z-index:1; background:transparent; }
@media (min-width:600px){ #phone{ border:1px solid var(--line);} }
#list{ display:flex; flex-direction:column; height:100%; }
#list header{ padding:22px 20px 14px; border-bottom:1px solid var(--line); background:rgba(18,14,15,.35); backdrop-filter:blur(2px); }
#list header .eyebrow{color:var(--moon); font-size:13px; letter-spacing:.02em;}
#list header h1{margin:4px 0 0; font-size:24px; font-weight:700;}
.contacts{flex:1; overflow-y:auto; padding:8px 10px;}
.contact{ display:flex; align-items:center; gap:14px; padding:12px 10px; border-radius:14px; cursor:pointer; transition:background .2s; }
.contact:hover{background:rgba(255,255,255,.08);}
.avatar{ width:48px; height:48px; border-radius:50%; flex:none; object-fit:cover; display:flex; align-items:center; justify-content:center; font-family:'Shippori Mincho',serif; font-weight:700; font-size:17px; color:#12100f; }
.cname{font-weight:600; font-size:15px;}
.cpreview{color:var(--muted); font-size:13px; margin-top:2px;}
.badge{ margin-left:auto; padding:3px 9px; border-radius:20px; font-size:10.5px; font-weight:600; letter-spacing:.02em; color:#171310; background:linear-gradient(135deg, var(--moon), var(--sky)); box-shadow:0 0 0 3px rgba(240,223,168,.12); }
.locked{opacity:.4; filter:grayscale(1);}
#chat{ display:none; flex-direction:column; height:100%; }
#chat.active{display:flex;}
.chat-head{ display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); background:rgba(18,14,15,.35); backdrop-filter:blur(2px); }
.back{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 8px;}
.chat-head .cname{font-size:16px;}
#messages{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;}
.bubble{ max-width:78%; padding:11px 15px; border-radius:16px; font-size:14.5px; line-height:1.5; opacity:0; transform:translateY(8px); animation:in .35s ease forwards; }
.them{background:rgba(36,28,28,.85); border-bottom-left-radius:4px; align-self:flex-start;}
.me{background:var(--teal); color:#fff; border-bottom-right-radius:4px; align-self:flex-end;}
@keyframes in{to{opacity:1; transform:translateY(0);}}
.typing{align-self:flex-start; display:flex; gap:4px; padding:12px 16px; background:rgba(36,28,28,.85); border-radius:16px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite;}
.typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
@keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}
#options{padding:10px 16px 18px; display:flex; flex-direction:column; gap:8px;}
.opt{ background:rgba(36,28,28,.7); backdrop-filter:blur(2px); border:1px solid var(--line); color:var(--text); padding:11px 14px; border-radius:14px; font-size:14px; text-align:left; cursor:pointer; transition:border-color .2s, transform .1s; }
.opt:hover{border-color:var(--sky);}
.opt:active{transform:scale(.98);}
#final{ display:none; height:100%; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:36px; position:relative; overflow:hidden;}
#final.active{display:flex;}
#final h2{font-size:22px; margin-bottom:14px;}
#final p{color:var(--muted); font-size:15px; line-height:1.7; max-width:38ch;}
.heart{font-size:38px; margin-bottom:6px;}
.petal{position:absolute; top:-20px; font-size:18px; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:.2;}}
::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="phone">
  <div id="list">
    <header>
      <div class="eyebrow serif">tu chat secreto</div>
      <h1>¿con quién quieres hablar hoy?</h1>
    </header>
    <div class="contacts" id="contactsEl"></div>
  </div>
  <div id="chat">
    <div class="chat-head">
      <button class="back" id="backBtn">←</button>
      <img class="avatar" id="chatAvatarImg" style="display:none">
      <div class="avatar" id="chatAvatar"></div>
      <div class="cname" id="chatName"></div>
    </div>
    <div id="messages"></div>
    <div id="options"></div>
  </div>
  <div id="final">
    <div class="heart">🖤</div>
    <h2 class="serif">antes de que se me olvide...</h2>
    <p id="finalText"></p>
  </div>
</div>

let visited = new Set();
const contactsEl = document.getElementById('contactsEl');
const listEl = document.getElementById('list');
const chatEl = document.getElementById('chat');
const finalEl = document.getElementById('final');
const messagesEl = document.getElementById('messages');
const optionsEl = document.getElementById('options');

function renderList(){
  contactsEl.innerHTML = '';
  chats.forEach(c=>{
    const row = document.createElement('div');
    row.className = 'contact';
    const avatarHtml = c.img ? `<img class="avatar" src="${c.img}">` : `<div class="avatar" style="background:${c.color}">${c.avatar}</div>`;
    row.innerHTML = `${avatarHtml}
      <div><div class="cname">${c.name}</div><div class="cpreview">${visited.has(c.id)?'ya hablaron ✓':'tiene algo que decirte'}</div></div>
      ${visited.has(c.id)?'':'<div class="badge">nuevo</div>'}`;
    row.onclick = ()=>openChat(c);
    contactsEl.appendChild(row);
  });
  const done = visited.size === chats.length;
  const row = document.createElement('div');
  row.className = 'contact' + (done?'':' locked');
  row.innerHTML = `<img class="avatar" src="${MYSTERY_IMG}">
    <div><div class="cname">alguien más</div><div class="cpreview">${done?'ya puedes abrir este chat':'habla con todos primero'}</div></div>`;
  if(done) row.onclick = openFinal;
  contactsEl.appendChild(row);
}

function openChat(c){
  listEl.style.display='none'; chatEl.classList.add('active');
  const imgEl = document.getElementById('chatAvatarImg');
  const divEl = document.getElementById('chatAvatar');
  if(c.img){ imgEl.src=c.img; imgEl.style.display='block'; divEl.style.display='none'; }
  else { imgEl.style.display='none'; divEl.style.display='flex'; divEl.style.background=c.color; divEl.textContent=c.avatar; }
  document.getElementById('chatName').textContent = c.name;
  messagesEl.innerHTML=''; optionsEl.innerHTML='';
  showSequence(c.open, ()=> showOptions(c.r1, c, 1));
}

function bubble(text, mine){
  const b=document.createElement('div');
  b.className='bubble '+(mine?'me':'them');
  b.textContent=text;
  messagesEl.appendChild(b);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showSequence(lines, done){
  let i=0;
  function next(){
    if(i>=lines.length){ done(); return; }
    const typing=document.createElement('div');
    typing.className='typing';
    typing.innerHTML='<span></span><span></span><span></span>';
    messagesEl.appendChild(typing); messagesEl.scrollTop=messagesEl.scrollHeight;
    setTimeout(()=>{
      typing.remove();
      bubble(lines[i], false);
      i++; setTimeout(next, 500);
    }, 700);
  }
  next();
}

function showOptions(roundOptions, c, round){
  optionsEl.innerHTML='';
  roundOptions.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='opt'; btn.textContent=o.t;
    btn.onclick=()=>{
      optionsEl.innerHTML='';
      bubble(o.t, true);
      setTimeout(()=> showSequence(o.a, ()=>{
        if(round===1){
          showOptions(c.r2, c, 2);
        } else {
          visited.add(c.id);
          const btn2=document.createElement('button');
          btn2.className='opt'; btn2.textContent='← volver';
          btn2.onclick=goBack;
          optionsEl.appendChild(btn2);
        }
      }), 450);
    };
    optionsEl.appendChild(btn);
  });
}

function goBack(){
  chatEl.classList.remove('active'); listEl.style.display='flex';
  renderList();
}
document.getElementById('backBtn').onclick = goBack;

function openFinal(){
  listEl.style.display='none'; finalEl.classList.add('active');
  document.getElementById('finalText').textContent = 'hola, ¿sabes? para mí no siempre es fácil recordar ciertas fechas, pero para mí tampoco existirá una fecha para tener que darte algo, o sorprenderte con estas cositas especiales que hago solo para ti, con mucho amor. — tu wawitoooo, ¡ti amooo! 🖤';
  for(let i=0;i<18;i++){
    const p=document.createElement('div');
    p.className='petal'; p.textContent = ['🖤','🥀','✨'][i%3];
    p.style.left = Math.random()*100+'%';
    p.style.animationDuration = (4+Math.random()*3)+'s';
    p.style.animationDelay = (Math.random()*2)+'s';
    finalEl.appendChild(p);
  }
}

renderList();
</script>
</body>
